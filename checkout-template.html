<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Checkout</title>

<!--
============================================================================
 MERCHANT INTEGRATION GUIDE — read this before going live
============================================================================
 This page is a UPI/QR checkout powered by the Kwicpe payment SDK. It is
 meant to be copied once per merchant and customized in 4 places only:

 1. BRANDING (plain HTML/CSS, search for "EDIT:" comments below)
    - Business name + logo initial in the header
    - Brand color: edit the CSS variables inside :root (top of <style>)
    - Footer line (optional, near the bottom of <body>)

 2. CHECKOUT SETTINGS — edit the MERCHANT_CONFIG object inside the
    <script> block near the bottom of this file (currency symbol,
    default amount, QR expiry time, etc.)

 3. PER-TRANSACTION SESSION DATA (required, do not skip)
    - sessionToken, redirectUrl, sessionExpiry, encryptKey
    - These are unique to every checkout and are returned by Kwicpe's
      "create checkout session" API. Fill them in one of two ways:
        a) Server-side templating: have your backend replace the
           {{sessionToken}}, {{redirectUrl}}, {{sessionExpiry}},
           {{encryptKey}} placeholders before sending this HTML, or
        b) Query string: load this page as
           checkout.html?session=...&redirect=...&expiry=...&encryptKey=...
    - Never hardcode a fixed value for any of these — each is single-use.

 4. SECURITY — do not skip this
    - Never place your Kwicpe API key/secret anywhere in this file.
      Anything in this HTML is visible to anyone via "View Source", so
      API keys belong only on your own backend server, used when you
      call Kwicpe's APIs to create the session in step 3.
    - Do not remove the <script> tags that load crypto-js or the Kwicpe
      SDK below — the checkout will not function without them.
============================================================================
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://admin.kwicpe.com/api/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* EDIT: change these to match your brand colors — everything else
   on the page reads its color from these variables. */
:root{
--primary:#0B72E7;
--primary-hover:#005FCC;
--success:#16A34A;
--danger:#DC2626;
--text:#111827;
--muted:#6B7280;
--border:#E5E7EB;
--surface:#FFFFFF;
--bg:#F8FAFC;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:var(--bg);
color:var(--text);
padding:20px;
min-height:100vh;
}

.container{max-width:480px;margin:auto}

.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
width:44px;height:44px;border-radius:12px;background:var(--primary);
display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px
}
.brand-text h1{font-size:18px;font-weight:700}
.brand-text p{font-size:12px;color:var(--muted);margin-top:2px}

.close-btn{
background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;
width:36px;height:36px;border-radius:8px
}
.close-btn:hover{background:var(--bg);color:var(--text)}

.card{
background:var(--surface);border:1px solid var(--border);border-radius:16px;
padding:24px;margin-bottom:16px
}

.amount-card{padding:18px 24px;text-align:center}
.amount-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.amount-display{font-size:30px;font-weight:800;color:var(--primary)}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{
width:100%;height:46px;border:1.5px solid var(--border);border-radius:10px;
padding:0 14px;font-size:14px;font-family:inherit
}
.form-group input:focus{outline:none;border-color:var(--primary)}

.pay-btn{
width:100%;height:52px;margin-top:8px;border:none;border-radius:12px;
background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer
}
.pay-btn:hover{background:var(--primary-hover)}
.pay-btn:disabled{opacity:.6;cursor:not-allowed}

#payment-container{text-align:center;padding:10px 0}
#payment-container img{max-width:240px;width:100%;border-radius:10px}

.timer-section{
display:flex;align-items:center;justify-content:center;gap:10px;
margin:16px 0;padding:14px;background:var(--bg);border-radius:10px
}
.timer-label{font-size:12px;color:var(--primary);font-weight:600}
.timer-value{font-size:22px;font-weight:800;color:var(--primary);font-family:'Courier New',monospace}

/* Hide the Kwicpe SDK's own default buttons — this page renders its own UI */
#payment-container button,
#payment-container [class*="button"],
#payment-container [class*="btn"],
[class*="payin"],
[class*="gateway"],
[class*="payment-btn"]{display:none !important;visibility:hidden !important}

.status{
position:sticky;top:10px;z-index:999;margin-bottom:16px;padding:16px;
border-radius:10px;background:var(--bg);color:var(--primary);font-size:14px;font-weight:600;
text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px
}
.status.success{background:#DCFCE7;color:var(--success)}
.status.failed{background:#FEE2E2;color:var(--danger)}

.spinner{
display:inline-block;width:16px;height:16px;border:3px solid currentColor;
border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.checkmark,.failed-icon{
display:inline-block;width:22px;height:22px;border-radius:50%;position:relative;flex-shrink:0
}
.checkmark{background:var(--success)}
.failed-icon{background:var(--danger)}
.checkmark::after,.failed-icon::after{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:bold;font-size:13px
}
.checkmark::after{content:'✓'}
.failed-icon::after{content:'✕'}

.footer{margin-top:24px;font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px;font-weight:600}

.modal-overlay{
position:fixed;inset:0;background:rgba(17,24,39,.7);display:none;
align-items:center;justify-content:center;padding:20px;z-index:1000
}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:28px;max-width:400px;width:100%;text-align:center}
.modal-title{font-size:20px;font-weight:800;margin-bottom:10px}
.modal-text{color:var(--muted);margin-bottom:22px;font-size:14px;line-height:1.6}
.modal-btn{
width:100%;height:48px;border:none;border-radius:10px;background:var(--primary);
color:#fff;font-weight:700;cursor:pointer;font-size:14px
}

.qr-pm-btn{
background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 8px;
cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px
}
.qr-pm-btn:hover{border-color:var(--primary)}
.qr-pm-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.qr-pm-icon svg{width:28px;height:28px;display:block}
.qr-pm-label{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}

.result-screen{min-height:60vh;display:flex;align-items:center;justify-content:center}
.result-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.result-icon{
width:90px;height:90px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;
justify-content:center;color:#fff;font-size:42px;font-weight:800
}
.result-icon.success{background:var(--success)}
.result-icon.failed{background:var(--danger)}
.result-title{font-size:26px;font-weight:800;margin-bottom:10px}
.result-message{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:26px}

@media(max-width:480px){
body{padding:12px}
.card{padding:18px}
.amount-display{font-size:26px}
}
</style>
</head>
<body>

<div class="container">

<!-- Header — EDIT: replace the logo initial and business name below -->
<div class="header-top">
  <div class="brand">
    <div class="logo">Y</div> <!-- EDIT: your logo initial, e.g. first letter of your brand -->
    <div class="brand-text">

</div>

<!-- Customer + amount form — shown before a payment session starts.
     Field IDs (amount, customerName, customerMobile, customerEmail) are
     read directly by submitPayment() below — keep the IDs unchanged even
     if you restyle the inputs. -->
<div id="formContainer">
  <div class="card">
    <div class="form-group">
      <label>Amount</label>
      <input id="amount" type="number" placeholder="Enter amount">
    </div>
    <div class="form-group">
      <label>Customer Name</label>
      <input id="customerName" placeholder="Enter full name">
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input id="customerMobile" placeholder="Enter mobile number">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input id="customerEmail" placeholder="Enter email address">
    </div>
    <button class="pay-btn" id="payBtn" onclick="submitPayment()" disabled>Pay Now</button>
  </div>
</div>

<!-- Success / failure screen -->
<div id="paymentResultCard" class="result-screen" style="display:none">
  <div class="result-card">
    <div id="resultIcon" class="result-icon success">✓</div>
    <div id="resultTitle" class="result-title">Payment Successful</div>
    <div id="resultMessage" class="result-message">Your payment has been received successfully.</div>
    <button class="pay-btn" onclick="resetCheckout()">Done</button>
  </div>
</div>

<!-- EDIT or remove: optional trust line shown under the form -->
<div class="footer">Secured Payments by Kwicpe</div>

</div>

<!-- Session expiry modal -->
<div id="expiryModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">⏰ Session Expired</div>
    <div class="modal-text">This payment session has expired. Please generate a new payment request to continue.</div>
    <button class="modal-btn" onclick="resetSession()">Generate New QR</button>
  </div>
</div>

<script>
/* ============================================================
   MERCHANT_CONFIG — the only block most merchants need to touch
   ============================================================ */
const MERCHANT_CONFIG = {
  CURRENCY_SYMBOL: "₹",        // e.g. "₹", "$", "€"
  NUMBER_LOCALE: "en-IN",      // used for digit grouping, e.g. "en-IN", "en-US"
  DEFAULT_AMOUNT: "",          // pre-fill a fixed amount, or leave "" for customer-entered
  QR_EXPIRY_MINUTES: 5,        // how long the UPI QR stays valid
};

const urlParams = new URLSearchParams(window.location.search);
let sessionToken = null;
let countdownInterval = null;
let currentUpiString = "";  
let paymentPollingInterval = null;
let currentOrderId = null;
let currentSessionId = null;
let redirectUrl = null;
let sessionExpiryTimer = null;

window.KWIC_CONFIG = null;

// Initialize the amount display from MERCHANT_CONFIG before anything else runs
document.getElementById("amount").value = MERCHANT_CONFIG.DEFAULT_AMOUNT;
document.getElementById("displayAmount").textContent =
    MERCHANT_CONFIG.CURRENCY_SYMBOL + (MERCHANT_CONFIG.DEFAULT_AMOUNT || "0");
document.getElementById("countdown").textContent =
    String(MERCHANT_CONFIG.QR_EXPIRY_MINUTES).padStart(2, "0") + ":00";

window.addEventListener("load", async () => {
    await initializeCheckout();
});

document.getElementById("amount").addEventListener("input", (e) => {
    document.getElementById("displayAmount").textContent =
        MERCHANT_CONFIG.CURRENCY_SYMBOL + Number(e.target.value || 0).toLocaleString(MERCHANT_CONFIG.NUMBER_LOCALE);
});

function redirectPage() {
    if (!redirectUrl) {
        alert("redirectUrl is not defined");
        return;
    }
    window.location.href = redirectUrl;
}

// Reads a per-transaction value from either a server-templated {{placeholder}}
// or, if that wasn't replaced, a matching URL query parameter.
function getSessionParam(templateValue, queryKey) {
    if (templateValue && !templateValue.startsWith("{{")) {
        return templateValue;
    }
    return urlParams.get(queryKey) || "";
}

function startSessionExpiryTimer(expiresAt) {
    if (!expiresAt) return;
    if (sessionExpiryTimer) clearTimeout(sessionExpiryTimer);

    const delay = new Date(expiresAt).getTime() - Date.now();
    if (delay <= 0) {
        handleSessionExpiry();
        return;
    }
    sessionExpiryTimer = setTimeout(handleSessionExpiry, delay);
}

async function handleSessionExpiry() {
    try {
        setStatus("failed", "Your session has expired. Please generate a new session.");
        await redirectPage();
        setTimeout(() => setStatus("hidden"), 3000);
    } catch (err) {
        console.error(err);
        setStatus("failed", "Unable to generate a new payment session.");
    }
}

async function initializeCheckout() {
    try {
        setStatus("processing", "Loading checkout...");

        // Per-transaction values — see "SESSION DATA" in the integration
        // guide at the top of this file. Do not hardcode these.
        // const token        = "{{sessionToken}}"; // Returned by the Checkout API
        // const redirectUrls  = "{{redirectUrl}}"; // Returned by the Checkout API
        // const expiresAtTimes = "{{expiresAt}}"; // Returned by the Checkout API
        // const encryptKey    = "{{your_static_enc_key}}";  // Provided during onboarding

        const token        = "X8ZHIcDiMbpLy7LERVDr9Q==:G7odCTlnAzpGytFhXuBHJsFMiaxIc+l/uNRR64Hti4fXRBDPyAENjz1YUckMJJk1Stt8CdWerS/7sGIHxiy0tqJwz3FPdbAy4qDBzb1pjKDHWOWdWHKRynxy/A8c+Y/u"
        const expiresAtTimes = "2026-07-01T09:22:59.846Z"
         const redirectUrls  = "https://admin.kwicpe.com"
        const encryptKey    = "4fe5db9be9efe2fb95067cb76a1adf7631caa62d98c6ecc5f4c5a3f695d13eec"
        if (!token || !redirectUrls || !expiresAtTimes || !encryptKey) {
            throw new Error("One or more required session parameters are missing");
        }

        sessionToken = token;
        currentSessionId = token;
        redirectUrl = decodeURIComponent(redirectUrls);

        startSessionExpiryTimer(expiresAtTimes);

        window.KWIC_CONFIG = {
            sessionToken,
            encryptKey,
            baseUrl: "https://admin.kwicpe.com/api",
        };

        document.getElementById("payBtn").disabled = false;
        setStatus("hidden");
    } catch (err) {
        console.error(err);
        setStatus("failed", err?.message || "Unable to initialize checkout");
    }
}

function setStatus(type, message) {
    const statusEl  = document.getElementById("status");
    const spinner   = document.getElementById("statusSpinner");
    const statusTxt = document.getElementById("statusText");
    if (!statusEl) return;

    statusEl.className = "status";
    spinner.style.display = "none";

    if (type === "hidden") {
        statusEl.style.display = "none";
        return;
    }

    statusEl.style.display = "flex";

    if (type === "processing") {
        spinner.style.display = "inline-block";
        statusTxt.innerHTML = message || "Waiting for payment confirmation...";
    } else if (type === "success") {
        statusEl.classList.add("success");
        statusTxt.innerHTML = `<span class="checkmark" style="margin-right:8px"></span>${message || "Payment Successful!"}`;
    } else if (type === "failed") {
        statusEl.classList.add("failed");
        statusTxt.innerHTML = `<span class="failed-icon" style="margin-right:8px"></span>${message || "Payment Failed."}`;
    }
}

function showFinalResult(status) {
    stopPaymentPolling();
    if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }

    document.querySelector(".amount-card").style.display = "none";
    document.querySelector(".header-top").style.display = "none";

    const footer = document.querySelector(".footer");
    if (footer) footer.style.display = "none";

    document.getElementById("formContainer").style.display = "none";
    document.getElementById("qrCardContainer").style.display = "none";

    const resultCard = document.getElementById("paymentResultCard");
    const resultIcon = document.getElementById("resultIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");

    resultCard.style.display = "flex";

    if (status === "SUCCESS") {
        resultIcon.className = "result-icon success";
        resultIcon.innerHTML = "✓";
        resultTitle.innerHTML = "Payment Successful";
        resultMessage.innerHTML = "Your payment has been received successfully. You may safely close this page.";
    } else {
        resultIcon.className = "result-icon failed";
        resultIcon.innerHTML = "✕";
        resultTitle.innerHTML = "Payment Failed";
        resultMessage.innerHTML = "We could not complete this transaction. Please try again.";
    }
    setStatus("hidden");
}

async function pollPaymentStatus() {
    try {
        if (!currentOrderId || !currentSessionId) return;

        const response = await fetch(
            `https://admin.kwicpe.com/api/v1/checkout/get-checkout-status?orderId=${encodeURIComponent(currentOrderId)}`,
            { method: "GET", headers: { "Content-Type": "application/json" } }
        );
        if (!response.ok) return;

        const result = await response.json();
        const status = result?.status;

        if (!status || status === "PROCESSING") return;
        if (status === "SUCCESS") return showFinalResult("SUCCESS");
        if (status === "FAILED") return showFinalResult("FAILED");
    } catch (err) {
        console.error("Polling Error:", err);
    }
}

function startPaymentPolling() {
    stopPaymentPolling();
    paymentPollingInterval = setInterval(pollPaymentStatus, 5000);
}

function stopPaymentPolling() {
    if (paymentPollingInterval) {
        clearInterval(paymentPollingInterval);
        paymentPollingInterval = null;
    }
}

async function submitPayment() {
    try {
        if (!window.KWIC_CONFIG?.sessionToken) {
            throw new Error("Checkout is still initializing. Please try again.");
        }

        setStatus("processing", "Initialising payment...");
        document.getElementById("payBtn").disabled = true;

        if (!window.KwicCheckout) {
            throw new Error("SDK not loaded");
        }

        const checkout = new KwicCheckout(window.KWIC_CONFIG);

        // These keys (customerName, customerEmail, customerMobile, amount)
        // are expected by the Kwicpe SDK — keep them as-is even if you
        // add or rename other form fields.
            const payload = {
                customerName: document.getElementById("customerName")?.value || "",
                customerEmail: document.getElementById("customerEmail")?.value || "",
                customerMobile: document.getElementById("customerMobile")?.value || "",
                amount: document.getElementById("amount")?.value || "",
            };
            console.log("Submitting payment with payload:", payload);

            const response = await checkout.submit(payload);
            console.log("Payment response:", response);
        if (response.RESPONSE_CODE !== "500") {
            setStatus("failed", response.RESPONSE_MESSAGE);
        } else {
            renderResponse(response);
        }
    } catch (err) {
        console.error("Payment Error:", err);
        setStatus("failed", err?.message || "Payment initialization failed");
        document.getElementById("payBtn").disabled = false;
    }
}

function startQrTimer() {
    const timerContainer = document.getElementById("timerContainer");
    const countdownEl = document.getElementById("countdown");
    if (!timerContainer || !countdownEl) return;

    timerContainer.style.display = "flex";
    const expiryTime = Date.now() + MERCHANT_CONFIG.QR_EXPIRY_MINUTES * 60 * 1000;

    if (countdownInterval) clearInterval(countdownInterval);

    function tick() {
        const remaining = expiryTime - Date.now();
        if (remaining <= 0) {
            clearInterval(countdownInterval);
            stopPaymentPolling();
            countdownEl.textContent = "00:00";
            document.getElementById("expiryModal").classList.add("show");
            return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        countdownEl.textContent = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
}

function launchUpiApp(app) {
    if (!currentUpiString) return;
    const upiUrl = currentUpiString;

    const appSchemes = {
        googlepay: upiUrl.replace("upi://", "tez://upi/"),
        phonepe: upiUrl.replace("upi://", "phonepe://"),
        paytm: upiUrl.replace("upi://", "paytmmp://"),
        upi: upiUrl,
    };

    window.location.href = appSchemes[app] || upiUrl;
}

function resetCheckout() {
    stopPaymentPolling();
    if (sessionExpiryTimer) {
        clearTimeout(sessionExpiryTimer);
        sessionExpiryTimer = null;
    }
    if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }

    document.getElementById("paymentResultCard").style.display = "none";
    document.getElementById("qrCardContainer").style.display = "none";
    document.getElementById("formContainer").style.display = "block";
    setStatus("hidden");

    currentUpiString = "";
    document.getElementById("qrPaymentMethods").style.display = "none";
    document.getElementById("payBtn").disabled = false;

    document.querySelector(".amount-card").style.display = "block";
    document.querySelector(".header-top").style.display = "flex";

    const footer = document.querySelector(".footer");
    if (footer) footer.style.display = "block";

    initializeCheckout();
}

async function expireCurrentSession() {
    try {
        if (!currentSessionId) return true;

        const response = await fetch("https://admin.kwicpe.com/api/v1/checkout/expire", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderId: currentOrderId }),
        });

        return response.ok;
    } catch (err) {
        console.error("Expire Session Error:", err);
        return false;
    }
}

async function resetSession() {
    try {
        if (sessionExpiryTimer) {
            clearTimeout(sessionExpiryTimer);
            sessionExpiryTimer = null;
        }
        document.getElementById("expiryModal").classList.remove("show");
        setStatus("processing", "Generating new payment session...");
        document.getElementById("payBtn").disabled = true;

        await expireCurrentSession();
        stopPaymentPolling();

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        currentUpiString = "";
        currentSessionId = null;
        sessionToken = null;

        document.getElementById("payment-container").innerHTML = "";
        document.getElementById("qrCardContainer").style.display = "none";
        document.getElementById("formContainer").style.display = "block";

        document.getElementById("amount").value = MERCHANT_CONFIG.DEFAULT_AMOUNT;
        document.getElementById("customerName").value = "";
        document.getElementById("customerMobile").value = "";
        document.getElementById("customerEmail").value = "";
        document.getElementById("displayAmount").textContent =
            MERCHANT_CONFIG.CURRENCY_SYMBOL + (MERCHANT_CONFIG.DEFAULT_AMOUNT || "0");

        await initializeCheckout();
    } catch (err) {
        console.error(err);
        setStatus("failed", "Failed to generate new QR");
    }
}

function renderResponse(response) {
    const status = response?.RESPONSE_STATUS || response?.status || "";
    const message = response?.RESPONSE_MESSAGE || response?.message || "";
    const qrBase64 = response?.QR_STRING || response?.qrBase64 || "";
    const upiString = response?.UPI_STRING || response?.upiString || response?.intent || "";
    const amount = response?.AMOUNT || response?.amount || "";

    if (amount) {
        const dispEl = document.getElementById("displayAmount");
        if (dispEl) {
            dispEl.textContent =
                MERCHANT_CONFIG.CURRENCY_SYMBOL + parseFloat(amount).toLocaleString(MERCHANT_CONFIG.NUMBER_LOCALE);
        }
    }

    if (status === "PROCESSING" || qrBase64 || upiString) {
        document.getElementById("formContainer").style.display = "none";
        document.getElementById("qrCardContainer").style.display = "block";

        const container = document.getElementById("payment-container");
        container.style.display = "block";

        setStatus("processing", message || "Waiting for payment confirmation...");

        let qrHtml = "";
        if (qrBase64) {
            qrHtml = `<img src="data:image/png;base64,${qrBase64}" alt="UPI QR Code" style="max-width:240px;width:100%;border-radius:10px;display:block;margin:0 auto"/>`;
        } else if (upiString) {
            const encoded = encodeURIComponent(upiString);
            qrHtml = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encoded}" alt="UPI QR Code" style="max-width:240px;width:100%;border-radius:10px;display:block;margin:0 auto"/>`;
        }

        container.innerHTML = `
            <p style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;text-align:center">
                Scan with any UPI app to pay
            </p>
            ${qrHtml}
        `;

        if (upiString) {
            currentUpiString = upiString;
            document.getElementById("qrPaymentMethods").style.display = "block";
        }

        startQrTimer();
        startPaymentPolling();
        return;
    }

    if (status === "SUCCESS" || status === "PAID") {
        stopPaymentPolling();
        setStatus("success", message || "Payment Successful!");
        if (countdownInterval) clearInterval(countdownInterval);
        return;
    }

    if (status === "FAILED" || status === "FAILURE") {
        stopPaymentPolling();
        setStatus("failed", message || "Payment Failed.");
        if (countdownInterval) clearInterval(countdownInterval);
        return;
    }

    if (response?.intent) {
        window.location.href = response.intent;
        return;
    }

    const result = document.getElementById("result");
    if (result) {
        result.style.display = "block";
        result.innerHTML = `<pre style="text-align:left;overflow:auto">${JSON.stringify(response, null, 2)}</pre>`;
    }
}
</script>
